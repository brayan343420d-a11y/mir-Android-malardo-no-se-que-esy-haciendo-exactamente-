      - name: Descargar runtime de .NET para Android
        run: |
          set -e
          cd src
          BASE=https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.linux-bionic-arm64
          VER=$(curl -fsSL $BASE/index.json | jq -r '.versions[]' | grep -E '^9\.0\.[0-9]+$' | sort -V | tail -1)
          echo "Runtime .NET: $VER"
          curl -fsSL "$BASE/$VER/microsoft.netcore.app.runtime.linux-bionic-arm64.$VER.nupkg" -o rt.nupkg
          mkdir rt && unzip -q rt.nupkg -d rt
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/runtime
          echo "$VER" > app/src/main/assets/runtime-version.txt
          find rt -path '*/native/*' -name '*.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          find rt -path '*/lib/net9.0/*' -name '*.dll' -exec cp {} app/src/main/assets/runtime/ \;
          echo "Nativas: $(ls app/src/main/jniLibs/arm64-v8a | wc -l)  Administradas: $(ls app/src/main/assets/runtime | wc -l)"
          ls app/src/main/jniLibs/arm64-v8a
          J=app/src/main/jniLibs/arm64-v8a
          {
            echo "Version runtime: $VER"
            echo "== archivos nativos =="; ls -l $J
            for f in $(ls $J); do
              echo "== NEEDED de $f =="; readelf -d $J/$f 2>/dev/null | grep NEEDED || true
            done
            echo "== simbolos coreclr/mono/hostfxr en libcoreclr.so =="
            readelf -Ws --dyn-syms $J/libcoreclr.so | grep -Ei "coreclr_|monovm|mono_jit_init|hostfxr" | awk '{print $8}' | head -40 || true
            echo "== otros archivos del paquete (no dll/so) =="
            find rt -type f ! -name '*.dll' ! -name '*.so' | head -40
          } > app/src/main/assets/runtime-info.txt
          test -f app/src/main/jniLibs/arm64-v8a/libcoreclr.so

      - name: Compilar Hello.dll
        run: |
          set -e
          cd src/hello
          dotnet publish -c Release -o out
          cp out/Hello.dll ../app/src/main/assets/Hello.dll
          cp out/Hello.runtimeconfig.json ../app/src/main/assets/
          cp out/Hello.deps.json ../app/src/main/assets/ || true
          ls out

      - name: Compilar APK
        working-directory: src
        run: gradle assembleDebug --stacktrace

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk MIR-Android.apk
          gh release create "build-${{ github.run_number }}" MIR-Android.apk \
            --repo "${{ github.repository }}" \
            --title "MIR Android build ${{ github.run_number }}" \
            --notes "APK debug generado automaticamente"
